services:
  app:
    build: .
    image: zeno-math
    restart: unless-stopped
    ports:
      # BIND_ADDRESS=127.0.0.1 keeps the port on this machine only, for when a reverse proxy (Caddy, nginx…) serves it
      # over HTTPS; the default is reachable from the network.
      - "${BIND_ADDRESS:-0.0.0.0}:8787:8787"
    environment:
      # Set a password to require HTTP basic auth (any username). Without one, anyone who can reach the port can
      # read, change and delete every board.
      APP_PASSWORD: ${APP_PASSWORD:-}
      # Needed to create classes and download the class study's data (X-Teacher-Password header). Without one,
      # anyone who can reach the port can.
      TEACHER_PASSWORD: ${TEACHER_PASSWORD:-}
      # Set to 1 behind a reverse proxy (with BIND_ADDRESS=127.0.0.1), so wrong passwords are counted per client
      # (from X-Forwarded-For) rather than for everyone at once: 10 wrong in 10 minutes and a client waits.
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Daily copies of the database in the volume's backups/ folder; how many to keep (0: none).
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  data:
