---
# Settings for npm run thesis-pdf (scripts/thesis-pdf.ts). The fonts are the host's, from /usr/share/fonts; the
# fallbacks cover the arrows, ticks, maths signs and Georgian that STIX Two Text lacks. The title page is written in
# 00-abstract.md itself, after the university's template (title as running head, the UG logo, author, committee,
# supervisor, date), so the title here only names the PDF; the date comes from the script and is printed there.
title-meta: "The Effect of Skill Granularity on Mastery Estimation in Adaptive Learning Systems"
author-meta: "Davit Tchintcharashvili"
documentclass: report
papersize: a4
fontsize: 11pt
geometry: margin=2.5cm
mainfont: "STIX Two Text"
mathfont: "STIX Two Math"
sansfont: "Noto Sans"
monofont: "Liberation Mono"
mainfontfallback: ["Noto Sans Math:", "Noto Serif Georgian:", "Noto Sans Symbols 2:", "Noto Sans Symbols:"]
# The contents come after the abstracts, as the department requires, so 00-abstract.md places them itself; the
# depth stops at the subchapters.
toc: false
linkcolor: blue
urlcolor: blue
link-citations: true
reference-section-title: References
# Smaller tables with captions as wide as the text, and figures no taller than 0.68 of the text block so a figure and its caption fit on one page.
header-includes: |
  \usepackage{etoolbox}
  \setcounter{tocdepth}{1}
  \AtBeginEnvironment{longtable}{\small}
  \setlength\LTcapwidth{\linewidth}
  \newsavebox\pbox
  \usepackage{graphicx}
  \usepackage{fancyhdr}
  \pagestyle{fancy}
  \fancyhf{}
  \renewcommand\headrulewidth{0pt}
  \fancyhead[R]{\small\itshape The Effect of Skill Granularity on Mastery Estimation in Adaptive Learning Systems}
  \fancyfoot[C]{\thepage}
  \fancypagestyle{plain}{\fancyhf{}\fancyhead[R]{\small\itshape The Effect of Skill Granularity on Mastery Estimation in Adaptive Learning Systems}\fancyfoot[C]{\thepage}}
  \AtBeginDocument{\renewcommand*\pandocbounded[1]{\sbox\pbox{#1}\ifdim\wd\pbox>\linewidth\sbox\pbox{\resizebox{\linewidth}{!}{#1}}\fi\ifdim\ht\pbox>0.68\textheight\resizebox{!}{0.68\textheight}{\usebox\pbox}\else\usebox\pbox\fi}}
---
